# SPDX-License-Identifier: Apache-2.0
# Production stack on WS04. Joins the shared core_net / core-postgres.
#
# The image is pulled, never built here. A stack that builds from a working
# copy on the host runs whatever that copy happened to contain, which is not
# necessarily what CI tested, scanned and published -- and afterwards nothing
# on the host can say which commit it was. MAKEITMD_IMAGE must therefore name
# an immutable GHCR reference, digest for preference:
#
#   MAKEITMD_IMAGE=ghcr.io/freshlabdev/makeitmd@sha256:<digest>
#
# A tag is accepted but a digest is what makes a rollback exact.
name: makeitmd

services:
  bot:
    image: ${MAKEITMD_IMAGE:?MAKEITMD_IMAGE must be an immutable GHCR reference}
    container_name: makeitmd-bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      MIGRATIONS_DIR: /app/migrations
      HTTP_ADDR: :8080
    networks: [core_net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  core_net:
    external: true
    name: core_net
